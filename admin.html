        }
        .input-focus-effect:focus {
            outline: none;
            border-bottom: 2px solid #E50914;
            transition: border-color 0.3s ease;
        }
        .shimmer {
            position: relative;
            overflow: hidden;
        }
        .shimmer::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.03), transparent);
            transform: rotate(45deg);
            animation: shimmer 6s infinite linear;
        }
        @keyframes shimmer {
            0% { transform: translate(-30%, -30%) rotate(45deg); }
            100% { transform: translate(30%, 30%) rotate(45deg); }
        }
    </style>

<body class="flex items-center justify-center min-h-screen relative">
<!-- Background Layer -->
<div class="fixed inset-0 z-0">
<div class="absolute inset-0 cinema-gradient"></div>
</div>
<!-- Login Container -->
<main class="relative z-10 w-full max-w-md px-container-padding-mobile md:px-0">
<div class="glass-panel p-8 md:p-12 rounded-xl shadow-2xl transition-transform duration-500 hover:scale-[1.01]">
<!-- Brand Identity -->
<div class="flex flex-col items-center mb-10">
<div class="w-16 h-16 bg-primary-container rounded-full flex items-center justify-center mb-6 shadow-[0_0_30px_rgba(229,9,20,0.4)]">
<span class="material-symbols-outlined text-white text-4xl" style="font-variation-settings: 'FILL' 1;">shield_person</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-center tracking-tight">એડમિન લોગિન</h1>
<p class="text-on-surface-variant font-body-md text-body-md mt-2 opacity-80">સુરક્ષિત એક્સેસ પોર્ટલ</p>
</div>
<!-- Form -->
<form class="space-y-8" id="loginForm" onsubmit="return handleLogin(event)">
<!-- Mobile Number Input -->
<div class="space-y-2 group">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center gap-2" for="mobile">
<span class="material-symbols-outlined text-sm">phone_android</span>
                        મોબાઈલ નંબર
                    </label>
<div class="relative">
<input class="w-full bg-surface-container-high border-none border-b-2 border-transparent text-on-surface p-4 rounded-lg font-body-md text-body-md input-focus-effect transition-all" id="mobile" placeholder="તમારો નંબર દાખલ કરો" required="" type="tel"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2 group">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center gap-2" for="password">
<span class="material-symbols-outlined text-sm">lock</span>
                        પાસવર્ડ
                    </label>
<div class="relative">
<input class="w-full bg-surface-container-high border-none border-b-2 border-transparent text-on-surface p-4 rounded-lg font-body-md text-body-md input-focus-effect transition-all" id="password" placeholder="admin123" required="" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="eyeIcon">visibility</span>
</button>
</div>
</div>
<!-- Action Button -->
<a class="shimmer w-full bg-primary-container text-white py-4 rounded-lg font-headline-md text-headline-md font-bold transition-all duration-300 hover:brightness-110 active:scale-[0.98] shadow-lg shadow-primary-container/20 flex items-center justify-center" href="{{DATA:SCREEN:SCREEN_9}}">લોગિન કરો</a><p class="text-on-surface-variant text-xs text-center mt-2">નોંધ: તમારો ડિફોલ્ટ પાસવર્ડ 'admin123' છે.</p>
<!-- Security Notice -->
<div class="pt-6 border-t border-surface-variant/30 text-center">
<p class="text-on-surface-variant text-xs flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-xs">verified_user</span>
                        આ એક સુરક્ષિત સર્વર છે. બધી ક્રિયાઓ મોનિટર કરવામાં આવે છે.
                    </p>
</div>
</form>
</div>
<!-- Footer Logo -->
<div class="mt-12 text-center opacity-40">
<p class="font-label-md text-label-md uppercase tracking-widest text-on-surface-variant">Freya Solution Academy</p>
</div>
</main>
<!-- UI Background Decoration Images (Contextual Cinematic Noir) -->
<div class="fixed top-0 right-0 w-1/3 h-full pointer-events-none z-[-1] opacity-20">
<div class="w-full h-full" data-alt="A cinematic, low-key lighting photography of a high-tech server room at night. Deep shadows and vibrant red LED status lights create a noir atmosphere. The aesthetic is clean, professional, and sophisticated, mirroring a premium streaming platform's dark mode visual style. Minimalist composition focuses on structural lines and atmospheric depth." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuB8TzLzXkeRK1UsskVFdmv5StfhtIbe1gmiwr5AuyPnjUQjwq19rkm7wnlHaL9rL_NkYWoFhf4qy7DOcSg7GApg4or_NZNwpNqOrCS_ZY-0G4cXdLqZxAj-aajzMpLlNxWl2PM08CHmKqhGRmCdbBfJdIg8pNovr_l6SVYKxR2k7od7rUebtQWphn2cWZeu6IAC6Gdi1KyWE7rByM6jh4z85u3zP1kyChXjcn0OdDTR-fBANQbFyys')"></div>
</div>
<script>
        function togglePassword() {
            const pwdInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                eyeIcon.innerText = 'visibility_off';
            } else {
                pwdInput.type = 'password';
                eyeIcon.innerText = 'visibility';
            }
        }

        function handleLogin(event) {
            event.preventDefault();
            const btn = event.target.querySelector('button[type="submit"]');
            const originalText = btn.innerText;
            
            // Micro-interaction
            btn.disabled = true;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span>';
            
            setTimeout(() => {
                btn.disabled = false;
                btn.innerText = originalText;
                alert('એક્સેસ નકારવામાં આવ્યો: કૃપા કરીને તમારી ઓળખ ચકાસો.');
            }, 1500);
            
            return false;
        }

        // Mouse Move Interactive Spotlight
        document.addEventListener('mousemove', (e) => {
            const body = document.querySelector('body');
            const x = e.clientX;
            const y = e.clientY;
            body.style.background = `radial-gradient(circle at ${x}px ${y}px, rgba(229, 9, 20, 0.03) 0%, rgba(0, 0, 0, 1) 50%)`;
        });
    </script>
</body></html>
